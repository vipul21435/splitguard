[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "splitguard"
version = "0.1.0"
description = "Find records, near-duplicates and groups that leak between dataset splits, and re-split without them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vipul Raj Jha" }]
keywords = ["data leakage", "dataset splits", "near-duplicates", "minhash", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "networkx>=3"]

[project.scripts]
splitguard = "splitguard.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/splitguard"

[tool.hatch.build.targets.wheel]
packages = ["src/splitguard"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
